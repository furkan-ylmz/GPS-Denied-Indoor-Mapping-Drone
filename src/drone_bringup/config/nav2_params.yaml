# ============================================================
# Nav2 Otonom Navigasyon Parametreleri
# Holonomik Drone (MPPI Omni) — ROS 2 Jazzy
# Gerçek Donanım: S500 + Pixhawk 6C Mini + Unitree L1 LiDAR
# Ortam: Üniversite koridorları (>1.5m genişlik, ~2.2-2.3m tavan)
# ============================================================

# --- Davranış Ağacı (Behavior Tree) Navigatörü ---
# Dronun genel otonom kararlarını (hedefe git, sıkışırsan kurtarma yap) yönetir.
bt_navigator:
  ros__parameters:
    global_frame: map             # Dünya koordinat sistemi
    robot_base_frame: base_link   # Dronun merkezi referans noktası
    odom_topic: /odom             # RTAB-Map'ten gelen odometry verisi

# --- Yerel Kontrolcü (MPPI Omni) ---
# Dronun anlık hareketlerini (hız, ivme, dönüşler) ve engellerden kaçışını hesaplar.
controller_server:
  ros__parameters:
    controller_frequency: 20.0        # Saniyede 20 kez karar üretir (Dronun hızlı tepki vermesi için çok önemli)
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001   # Y ekseninde (sağ/sol) çok küçük hızlara bile izin verir (Holonomik hareket)
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    # İlerleme Kontrolcüsü (Dronun bir yere sıkışıp sıkışmadığını anlar)
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5   # 15 saniye içinde en az 0.5 metre hareket edemezse "sıkıştım" der
      movement_time_allowance: 15.0   # Hedefe ilk dönüş sırasında timeout olmaması için 10→15 saniye

    # Hedefe Ulaşım Kontrolcüsü (Hedefe vardığını nasıl anlayacak?)
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25         # Hedefin 25 cm yakınına gelirse "vardım" sayar
      yaw_goal_tolerance: 3.50        # Devre dışı (Süpürme explore.py'de yapılacağı için)
      stateful: true

    # MPPI Kontrolcüsü (Model Predictive Path Integral) - Ana Uçuş Algoritması
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40                  # Geleceğe yönelik 40 adım (40 * 0.05s = 2.0 saniye) sonrasını tahmin eder
      model_dt: 0.05                  # Tahmin adımlarının süresi
      batch_size: 300                 # 500→300: RPi 5 CPU optimizasyonu (daha az rota hesaplaması)
      iteration_count: 1
      temperature: 0.35               # Biraz daha cesur rota seçimi (0.3→0.35), düz yolda daha kararlı hızlanır
      gamma: 0.015
      motion_model: "Omni"            # KRİTİK: Dronun sağa-sola, ileri-geri her yöne dönebilmesini sağlayan model
      visualize: false                # RViz'de o 300 rotayı çizmesini kapatır (Açıksa CPU'yu bitirir)
      prune_distance: 3.0             # Daha ilerideki yol noktalarını da hesaba katır (1.7→3.0, hızlı uçuşta önemli)
      transform_tolerance: 0.1
      retry_attempt_limit: 1

      # Uçuş Hız Limitleri (m/s) — Kapalı koridor güvenliği için düşürüldü
      vx_max: 1.0                     # 3.5→1.0: Kapalı alan güvenli maksimum ileri hız
      vx_min: -0.5                    # -1.0→-0.5: Geri gitme hızı sınırlandı
      vy_max: 0.8                     # 2.5→0.8: Yana kayma hızı azaltıldı
      wz_max: 1.0                     # 1.5→1.0: Dönüş hızı azaltıldı

      # İvme Limitleri (m/s²) — Yumuşak hareketler için düşürüldü
      ax_max: 2.0                     # 4.0→2.0: Daha yumuşak ivmelenme
      ax_min: -2.0                    # -4.0→-2.0: Daha yumuşak frenleme
      ay_max: 1.5                     # 3.5→1.5: Yana ivmelenme düşürüldü
      ay_min: -1.5
      az_max: 2.0

      # Rastgelelik (Örnekleme) Yayılımları - Dronun yapacağı küçük hareket arayışlarının şiddeti
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4                     # Yaw (Dönüş) yönündeki arayış (Küçük yaw titreşimlerinin ana nedenlerinden biri)

      # =========================================================
      # CRITIC'ler (Eleştirmenler) - MPPI'ın Karar Verme Mekanizması
      # O 300 rastgele rotanın her birine puan veren jüri üyeleridir.
      # =========================================================
      critics: [
        "ConstraintCritic",
        "CostCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic"
      ]

      # 1. Engel Çarpışma Jürisi (En önemlisi)
      ConstraintCritic:
        enabled: true
        cost_weight: 4.0              # Çarpışacak rotaları acımasızca eler
        cost_power: 1

      # 2. Maliyet Jürisi (Duvarlara olan uzaklık)
      CostCritic:
        enabled: true
        cost_weight: 3.81             # Duvara/engele yakın geçen rotalara kötü puan verir
        cost_power: 1
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0     # Engelin tam üstünden geçen rotaya sonsuz ceza
        near_goal_distance: 1.0

      # 3. Hedefe Yaklaşma Jürisi
      GoalCritic:
        enabled: true
        cost_weight: 5.0              # Dronu sürekli hedefe doğru çeken güçtür
        cost_power: 1
        threshold_to_consider: 1.4

      # 4. Hedef Açısı Jürisi
      GoalAngleCritic:
        enabled: true
        cost_weight: 5.0              # Hedefe dönüş davranışını güçlendirir (3.0→5.0)
        cost_power: 1
        threshold_to_consider: 0.5

      # 5. Yola Hizalama Jürisi
      PathAlignCritic:
        enabled: true
        cost_weight: 10.0             # Yola bağlılık (14→10), akıcı hız ve yol sadakatinin dengesi
        cost_power: 1
        max_path_occupancy_ratio: 0.05
        threshold_to_consider: 0.5
        trajectory_point_step: 3

      # 6. Yolu Takip Jürisi
      PathFollowCritic:
        enabled: true
        cost_weight: 5.0              # Yolun ilerisindeki noktalara ulaşmasını teşvik eder
        cost_power: 1
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      # 7. Yol Açısı Jürisi (Dronun YAW hareketlerini belirler)
      PathAngleCritic:
        enabled: true
        cost_weight: 2.0              # Dronun burnunun gideceği yöne dönük olmasını sağlar
        cost_power: 1
        threshold_to_consider: 0.5
        offset_from_furthest: 4
        max_angle_to_furthest: 1.0


# --- Global Planlayıcı (A* Kuşbakışı Rota Bulucu) ---
# Başlangıçtan hedefe labirent çözer gibi ana hattı (kırmızı çizgi) çizer.
planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      use_astar: true                 # A* (A-yıldız) algoritmasını kullanır (En kısa yol)
      allow_unknown: true             # Henüz haritası çıkarılmamış siyah bölgelerden geçmesine izin verir
      tolerance: 0.5                  # Hedefin tam üstü engelli ise 50 cm yakınına rota çizer

# --- Kurtarma Davranışları (Recovery) ---
behavior_server:
  ros__parameters:
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"  # Sıkışınca kendi etrafında dönerek Lidar ile etrafı tarama kurtarması
    backup:
      plugin: "nav2_behaviors::BackUp" # Geri geri çıkma kurtarması
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0

# ============================================================
# GLOBAL COSTMAP — RTAB-Map /map üzerinden statik dünya
# ============================================================
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0           # Saniyede 1 kez haritayı günceller (Çok sık olması CPU'yu yorar, gereksizdir)
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.30              # 0.35→0.30: S500 frame prop-to-prop ~50cm, güvenlik yarıçapı 30cm
      resolution: 0.05                # Haritadaki her pikselin gerçek hayattaki boyutu (5 cm)
      track_unknown_space: true
      rolling_window: false           # Harita sabittir, dronla birlikte kaymaz

      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        enabled: true
        map_topic: "/map"             # RTAB-Map'ten gelen kalıcı 2D haritayı okur
        subscribe_to_updates: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0      # Duvarlardan uzaklaştıkça tehlikenin azalma hızı
        inflation_radius: 0.50        # Duvarların etrafına çizilen 50 cm'lik görünmez "uzak dur" alanı

# ============================================================
# LOCAL COSTMAP — Unitree L1 LiDAR ile Anlık Engeller
# ============================================================
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0           # Saniyede 5 kez güncellenir (Aniden çıkan nesnelere refleks göstermek için)
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      robot_radius: 0.30              # 0.35→0.30: S500 frame güvenlik yarıçapı
      resolution: 0.05
      rolling_window: true            # Dron hareket ettikçe harita dronun etrafında kayar (5x5 metrelik görüş penceresi)
      width: 5                        # Çevresindeki 5 metrelik alanı anlık olarak inceler
      height: 5

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: lidar_points
        lidar_points:
          topic: "/unilidar/cloud"    # /lidar/points→/unilidar/cloud: Unitree L1 gerçek LiDAR topic'i
          data_type: "PointCloud2"
          marking: true               # Lidar ışını bir şeye çarparsa oraya "engel var" işareti koy
          clearing: true              # Lidar ışını boşluktan geçerse o bölgeyi "engel yok" diye temizle
          obstacle_max_range: 3.0     # Dron sadece 3 metreye kadar olan engelleri umursar
          obstacle_min_range: 0.15    # 0.4→0.15: L1 min range 0.05m, gövde filtresi için 15cm
          raytrace_max_range: 4.0     # Dron 4 metreye kadar olan boşlukları tarayıp temizler
          raytrace_min_range: 0.15    # 0.4→0.15: L1'in yakın menzil avantajını kullan
          max_obstacle_height: 2.20   # 1.80→2.20: Koridor tavanına kadar engel algıla (~2.2-2.3m)
          min_obstacle_height: 0.80   # 1.20→0.80: Daha muhafazakar — yerden 80cm üstü engel say
          inf_is_valid: false
          sensor_frame: "unilidar_lidar"  # lidar_link→unilidar_lidar: Unitree L1 frame_id

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.50

# ============================================================
# LIFECYCLE MANAGER
# ============================================================
lifecycle_manager_navigation:
  ros__parameters:
    autostart: true                   # Nav2 sistemini "active" durumuna otomatik geçirir
    bond_timeout: 4.0
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
