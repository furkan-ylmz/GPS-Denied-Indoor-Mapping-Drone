door_ocr_node:
  ros__parameters:
    image_topic: /camera
    label_topic: /ocr/door_label
    valid_topic: /ocr/door_label_valid
    labels_all_topic: /ocr/door_labels_all
    detections_topic: /ocr/door_label_detections
    confirmed_label_topic: /ocr/door_label_confirmed
    confirmed_valid_topic: /ocr/door_label_confirmed_valid
    needs_closer_view_topic: /ocr/needs_closer_view
    reset_confirmation_topic: /ocr/reset_confirmation
    active_target_topic: /ocr/active_target
    target_roi_topic: /ocr/target_roi
    debug_image_topic: /ocr/debug_image
    crop_debug_image_topic: /ocr/crop_debug_image
    legacy_debug_image_topic: /ocr/raw
    publish_debug_image: true
    confidence_threshold: 0.38
    process_every_n: 1
    max_labels_per_frame: 5
    label_regex: '^[A-Z0-9][A-Z0-9-]{1,20}$'
    language: en
    use_gpu: false
    backend: rapidocr
    enable_crop_retry: true
    crop_retry_scale: 2.0
    crop_retry_padding_px: 28
    crop_retry_accept_threshold: 0.45
    enable_crop_retry_variants: true
    crop_retry_mode: sharp_only
    crop_retry_scale_mode: stepped
    crop_retry_scale_candidates: "2.0,2.5,3.0"
    crop_retry_target_height_px: 105
    crop_retry_max_scale: 3.0
    crop_debug_target_height_px: 180
    crop_retry_variant_min_score: 0.82
    crop_retry_refine_max_candidates: 1
    crop_retry_fallback_max_candidates: 2
    enable_roi_retry: true
    roi_retry_x_min: 0.15
    roi_retry_x_max: 0.85
    roi_retry_y_min: 0.20
    roi_retry_y_max: 0.62
    enable_sign_detection_retry: true
    sign_retry_min_area_px: 18
    sign_retry_max_area_ratio: 0.018
    sign_retry_min_aspect: 2.0
    sign_retry_max_aspect: 12.0
    sign_retry_padding_ratio: 0.90
    sign_retry_max_candidates: 2
    vote_window_size: 5
    vote_min_observations: 3
    vote_min_char_ratio: 0.66
    vote_min_char_margin: 0.18
    confirmed_change_min_observations: 4
    confirmed_change_min_char_ratio: 0.70
    confirmed_change_min_char_margin: 0.20
    ambiguous_char_margin: 0.35
    prefer_letter_suffix: false
    letter_suffix_digit_count: 3
    enable_confirmation_guard: true
    confirm_min_text_height_px: 8.0
    confirm_min_ambiguous_text_height_px: 18.0
    target_ambiguity_ratio: 0.55
    enable_target_gate: true
    target_gate_half_width: 0.20
    target_gate_half_height: 0.30
    guard_on_multiple_signs: true
    guard_confusable_label_changes: true
    enable_target_door_priority: true
    target_center_x: 0.50
    target_center_y: 0.47
    target_center_weight: 1.20
    target_size_weight: 0.20

door_semantic_mapper:
  ros__parameters:
    confirmed_label_topic: /ocr/door_label_confirmed
    confirmed_valid_topic: /ocr/door_label_confirmed_valid
    odom_topic: /drone/odom
    reset_topic: /ocr/door_map_reset
    reset_confirmation_topic: /ocr/reset_confirmation
    marker_topic: /ocr/door_label_markers
    map_json_path: docs/door_labels.json
    marker_frame_id: odom
    label_distance_ahead_m: 1.5
    use_fixed_marker_z: true
    fixed_marker_z: 1.4
    marker_z_offset: 0.0
    merge_radius_m: 1.0
    allow_duplicate_labels: false
    min_accept_interval_sec: 1.0
    stale_odom_timeout_sec: 2.0
    marker_publish_period_sec: 0.5
    text_scale: 0.35
    anchor_scale: 0.18
    promote_alternative_labels: true
    label_promotion_min_observations: 3
    label_promotion_margin: 2
