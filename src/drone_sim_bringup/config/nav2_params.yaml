# ═══════════════════════════════════════════════
#  Nav2 Path Planning Parameters
#  Drone SLAM projesi — kapalı alan navigasyonu
# ═══════════════════════════════════════════════
#
# Sadece planner_server + global_costmap kullanılır.
# Controller yok — drone_navigator.py PX4 setpoint ile path takibi yapar.

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.65
      use_astar: true
      allow_unknown: false          # true → false: keşfedilmemiş alana path çizme

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
      robot_radius: 0.55            # 0.50 → 0.55: daha geniş güvenlik çapı
      resolution: 0.1
      track_unknown_space: true
      unknown_cost_value: 255
      lethal_cost_threshold: 100
      always_send_full_costmap: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
        map_topic: /map_clean
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5     # 3.0 → 2.5: maliyet daha yavaş düşer, duvardan uzak tutar
        inflation_radius: 1.0        # 0.68 → 1.0: daha geniş şişirme yarıçapı
        inflate_unknown: true        # false → true: bilinmeyen alanları da tehlikeli say
